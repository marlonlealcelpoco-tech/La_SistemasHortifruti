<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar — LA Sistemas ERP</title>
  <link rel="stylesheet" href="./styles/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="brand-panel" aria-label="LA Sistemas ERP">
      <img class="brand-logo" src="./styles/logo_colorido.png" alt="LA Sistemas ERP">
      <div class="brand-watermark" aria-hidden="true">
        <img src="./styles/logo_azul.png" alt="">
      </div>
      <div class="brand-copy">
        <span>GESTÃO INTEGRADA</span>
        <h1>Seu negócio sob controle.</h1>
      </div>
    </section>

    <section class="form-panel">
      <div class="login-card">
        <div class="mobile-brand">
          <img class="mobile-logo" src="./styles/logo_colorido.png" alt="LA Sistemas ERP">
        </div>
        <span class="eyebrow">ACESSO AO SISTEMA</span>
        <h2>Bem-vindo</h2>
        <p class="subtitle">Entre com suas credenciais para continuar.</p>

        <form id="loginForm" novalidate>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="seu@email.com" required maxlength="180">

          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required minlength="8" maxlength="128">

          <div id="loginError" class="error" role="alert" hidden></div>
          <button id="loginButton" type="submit">Entrar <span>→</span></button>
        </form>

        <small class="security-note">Acesso protegido pela autenticação oficial do LA Sistemas ERP.</small>
      </div>
    </section>
  </main>
  <script src="./js/api.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
