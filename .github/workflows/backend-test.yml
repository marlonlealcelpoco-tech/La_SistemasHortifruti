name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend-test.yml'
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: la_erp
          POSTGRES_USER: la_erp
          POSTGRES_PASSWORD: la_erp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U la_erp -d la_erp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://la_erp:la_erp_dev@127.0.0.1:5432/la_erp
      JWT_SECRET: ci-test-secret-key-with-at-least-32-characters
      BOOTSTRAP_TOKEN: ci-bootstrap-token-with-at-least-16-chars
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin1234
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Initialize database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Apply database migrations
        run: |
          set -e
          for file in database/migrations/*.sql; do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Reset CI users
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'TRUNCATE TABLE users CASCADE;'
      - name: Seed CI administrator
        working-directory: backend
        run: |
          node --input-type=module <<'NODE'
          import bcrypt from 'bcrypt';
          import pg from 'pg';
          const { Pool } = pg;
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          const client = await pool.connect();
          try {
            await client.query('BEGIN');
            const role = await client.query('SELECT id FROM roles WHERE name = $1::text', ['ADMIN']);
            if (role.rowCount === 0) throw new Error('ADMIN role was not created by migrations');
            const hash = await bcrypt.hash(process.env.ADMIN_PASSWORD, 12);
            await client.query(
              'INSERT INTO users (id, name, email, password_hash, active) VALUES ($1::bigint, $2::text, $3::text, $4::text, TRUE)',
              [1, 'Admin', process.env.ADMIN_EMAIL, hash]
            );
            await client.query(
              'INSERT INTO user_roles (user_id, role_id) VALUES ($1::bigint, $2::bigint)',
              [1, role.rows[0].id]
            );
            await client.query('COMMIT');
            console.log('CI administrator seeded:', process.env.ADMIN_EMAIL);
          } catch (error) {
            await client.query('ROLLBACK');
            throw error;
          } finally {
            client.release();
            await pool.end();
          }
          NODE
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Unit tests
        working-directory: backend
        run: npm test
      - name: Start API
        working-directory: backend
        run: |
          npm start > /tmp/backend.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/health.json; then cat /tmp/health.json; exit 0; fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1
      - name: Functional API smoke tests
        shell: bash
        run: |
          set -euo pipefail
          echo '1) /health'
          curl --fail --silent http://127.0.0.1:3000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          echo '2) Login with Admin / Admin1234'
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"Admin1234"}' \
            http://127.0.0.1:3000/auth/login > /tmp/login.json
          cat /tmp/login.json
          LOGIN_TOKEN="$(jq -r '.token' /tmp/login.json)"
          test -n "$LOGIN_TOKEN" && test "$LOGIN_TOKEN" != "null"
          echo '3) /auth/me'
          curl --fail --silent -H "Authorization: Bearer $LOGIN_TOKEN" http://127.0.0.1:3000/auth/me > /tmp/me.json
          cat /tmp/me.json
          grep -q 'Admin' /tmp/me.json
          echo '4) Create product'
          curl --fail --silent --show-error -H "Authorization: Bearer $LOGIN_TOKEN" -H 'Content-Type: application/json' \
            -d '{"code":"CI-001","name":"Produto CI","unit":"UN","cost":0.65,"salePrice":2.49,"profitMarginPct":283.08}' \
            http://127.0.0.1:3000/products > /tmp/product.json
          cat /tmp/product.json
          PRODUCT_ID="$(jq -r '.product.id' /tmp/product.json)"
          test "$PRODUCT_ID" != "null"
          echo '5) List products'
          curl --fail --silent -H "Authorization: Bearer $LOGIN_TOKEN" 'http://127.0.0.1:3000/products?search=Produto%20CI' > /tmp/products.json
          cat /tmp/products.json
          grep -q 'Produto CI' /tmp/products.json
          echo '6) Update product'
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer $LOGIN_TOKEN" -H 'Content-Type: application/json' \
            -d '{"code":"CI-001","name":"Produto CI Atualizado","unit":"UN","cost":0.70,"salePrice":2.79,"profitMarginPct":298.57}' \
            "http://127.0.0.1:3000/products/$PRODUCT_ID" > /tmp/product-updated.json
          cat /tmp/product-updated.json
          grep -q 'Produto CI Atualizado' /tmp/product-updated.json
          echo 'Backend smoke tests passed.'
