# CI trigger: fornecedor functional test
name: Backend CI

on:
  push:
    branches: [main, refactor/backend-modular]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'tests/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'database/**'
      - 'tests/**'
      - '.github/workflows/backend-test.yml'
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: la_erp
          POSTGRES_USER: la_erp
          POSTGRES_PASSWORD: la_erp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U la_erp -d la_erp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://la_erp:la_erp_dev@127.0.0.1:5432/la_erp
      JWT_SECRET: ci-test-secret-key-with-at-least-32-characters
      BOOTSTRAP_TOKEN: ci-bootstrap-token-with-at-least-16-chars
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin1234
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Initialize database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Apply database migrations
        run: |
          set -e
          for file in database/migrations/*.sql; do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify official authorization role catalog
        run: |
          set -euo pipefail
          EXPECTED='ADMIN GERENTE SUPERVISOR VENDAS ESTOQUE FINANCEIRO'
          ACTUAL=$(psql "$DATABASE_URL" -tAc "SELECT string_agg(name, ' ' ORDER BY name) FROM roles WHERE name IN ('ADMIN','GERENTE','SUPERVISOR','VENDAS','ESTOQUE','FINANCEIRO');")
          echo "Expected roles: $EXPECTED"
          echo "Actual roles:   $ACTUAL"
          test "$ACTUAL" = 'ADMIN ESTOQUE FINANCEIRO GERENTE SUPERVISOR VENDAS'
      - name: Reset CI users
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'TRUNCATE TABLE users CASCADE;'
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Unit tests
        working-directory: backend
        run: npm test
      - name: Reset database after unit tests
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'TRUNCATE TABLE users CASCADE;'
      - name: Start API
        working-directory: backend
        run: |
          npm start > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/health.json; then cat /tmp/health.json; exit 0; fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1
      - name: Verify database is empty before bootstrap
        run: |
          set -euo pipefail
          USERS_COUNT=$(psql "$DATABASE_URL" -tAc 'SELECT COUNT(*) FROM users;')
          test "$USERS_COUNT" = "0"
      - name: Functional API smoke tests
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:3000/health
          SETUP_STATUS=$(curl -sS -o /tmp/setup.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"Admin","email":"Admin@example.com","password":"Admin1234","bootstrapToken":"ci-bootstrap-token-with-at-least-16-chars"}' http://127.0.0.1:3000/auth/setup || true)
          test "$SETUP_STATUS" = "200" || test "$SETUP_STATUS" = "201"
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"Admin@example.com","password":"Admin1234"}' http://127.0.0.1:3000/auth/login > /tmp/login.json
          LOGIN_TOKEN="$(jq -r '.token' /tmp/login.json)"
          test -n "$LOGIN_TOKEN" && test "$LOGIN_TOKEN" != "null"
          curl --fail --silent -H "Authorization: Bearer $LOGIN_TOKEN" http://127.0.0.1:3000/auth/me
          echo 'Backend smoke tests passed.'
      - name: Module 1 - Authentication and hierarchy
        shell: bash
        run: bash tests/integration/backend-auth-hierarchy.sh
      - name: Real ERP API integration battery
        shell: bash
        run: bash tests/integration/backend-api-e2e.sh
      - name: Comprehensive backend API battery
        shell: bash
        run: bash tests/integration/backend-api-comprehensive.sh
      - name: Module 2 - Cadastros authorization matrix
        shell: bash
        run: bash tests/integration/backend-cadastros-authorization.sh
      - name: Module 2 - Clientes functional battery
        shell: bash
        run: bash tests/integration/backend-cadastro-clientes-functional.sh
      - name: Module 2 - Fornecedores functional battery
        shell: bash
        run: bash tests/integration/backend-cadastro-fornecedores-functional.sh
      - name: Module 2 - Cadastros functional battery
        shell: bash
        run: bash tests/integration/backend-cadastros-functional.sh
      - name: Module 2 - Product fiscal data
        shell: bash
        run: bash tests/integration/backend-product-fiscal.sh
