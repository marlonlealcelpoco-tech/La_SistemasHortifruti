# CI trigger: fornecedor functional test
name: Backend CI

on:
  push:
    branches: [main, refactor/backend-modular]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'tests/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'database/**'
      - 'tests/**'
      - '.github/workflows/backend-test.yml'
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: la_erp
          POSTGRES_USER: la_erp
          POSTGRES_PASSWORD: la_erp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U la_erp -d la_erp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://la_erp:la_erp_dev@127.0.0.1:5432/la_erp
      JWT_SECRET: ci-test-secret-key-with-at-least-32-characters
      BOOTSTRAP_TOKEN: ci-bootstrap-token-with-at-least-16-chars
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin1234
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Initialize database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Apply database migrations
        run: |
          set -e
          for file in database/migrations/*.sql; do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify official authorization role catalog
        run: |
          set -euo pipefail
          EXPECTED='ADMIN GERENTE SUPERVISOR VENDAS ESTOQUE FINANCEIRO'
          ACTUAL=$(psql "$DATABASE_URL" -tAc "SELECT string_agg(name, ' ' ORDER BY name) FROM roles WHERE name IN ('ADMIN','GERENTE','SUPERVISOR','VENDAS','ESTOQUE','FINANCEIRO');")
          echo "Expected roles: $EXPECTED"
          echo "Actual roles:   $ACTUAL"
          test "$ACTUAL" = 'ADMIN ESTOQUE FINANCEIRO GERENTE SUPERVISOR VENDAS'
      - name: Reset CI users
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'TRUNCATE TABLE users CASCADE;'
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Unit tests
        working-directory: backend
        run: npm test
      - name: Reset database after unit tests
        run: |
          set -euo pipefail
          echo 'Resetting users after unit tests'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'TRUNCATE TABLE users CASCADE;'
          USERS_COUNT=$(psql "$DATABASE_URL" -tAc 'SELECT COUNT(*) FROM users;')
          echo "CI users before API smoke test: $USERS_COUNT"
          test "$USERS_COUNT" = "0"
      - name: Start API
        working-directory: backend
        run: |
          npm start > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/health.json; then cat /tmp/health.json; exit 0; fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1
      - name: Verify database is empty before bootstrap
        run: |
          set -euo pipefail
          USERS_COUNT=$(psql "$DATABASE_URL" -tAc 'SELECT COUNT(*) FROM users;')
          echo "CI users before /auth/setup: $USERS_COUNT"
          test "$USERS_COUNT" = "0"
      - name: Functional API smoke tests
        shell: bash
        run: |
          set -euo pipefail
          echo '1) /health'
          curl --fail --silent http://127.0.0.1:3000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          echo '2) Bootstrap administrator'
          SETUP_STATUS=$(curl -sS -o /tmp/setup.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"name":"Admin","email":"Admin@example.com","password":"Admin1234","bootstrapToken":"ci-bootstrap-token-with-at-least-16-chars"}' \
            http://127.0.0.1:3000/auth/setup || true)
          cat /tmp/setup.json
          if [ "$SETUP_STATUS" != "200" ] && [ "$SETUP_STATUS" != "201" ]; then
            echo "Bootstrap failed with HTTP $SETUP_STATUS"
            exit 1
          fi
          echo '3) Login with Admin / Admin1234'
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d '{"email":"Admin@example.com","password":"Admin1234"}' \
            http://127.0.0.1:3000/auth/login > /tmp/login.json
          cat /tmp/login.json
          LOGIN_TOKEN="$(jq -r '.token' /tmp/login.json)"
          test -n "$LOGIN_TOKEN" && test "$LOGIN_TOKEN" != "null"
          echo '4) /auth/me'
          curl --fail --silent -H "Authorization: Bearer $LOGIN_TOKEN" http://127.0.0.1:3000/auth/me > /tmp/me.json
          cat /tmp/me.json
          grep -q 'Admin' /tmp/me.json
          echo '5) Create product'
          curl --fail --silent --show-error -H "Authorization: Bearer $LOGIN_TOKEN" -H 'Content-Type: application/json' \
            -d '{"code":"CI-001","name":"Produto CI","unit":"UN","cost":0.65,"salePrice":2.49,"profitMarginPct":283.08}' \
            http://127.0.0.1:3000/products > /tmp/product.json
          cat /tmp/product.json
          PRODUCT_ID="$(jq -r '.product.id' /tmp/product.json)"
          test "$PRODUCT_ID" != "null"
          echo '6) List products'
          curl --fail --silent -H "Authorization: Bearer $LOGIN_TOKEN" 'http://127.0.0.1:3000/products?search=Produto%20CI' > /tmp/products.json
          cat /tmp/products.json
          grep -q 'Produto CI' /tmp/products.json
          echo '7) Update product'
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer $LOGIN_TOKEN" -H 'Content-Type: application/json' \
            -d '{"code":"CI-001","name":"Produto CI Atualizado","unit":"UN","cost":0.70,"salePrice":2.79,"profitMarginPct":298.57}' \
            "http://127.0.0.1:3000/products/$PRODUCT_ID" > /tmp/product-updated.json
          cat /tmp/product-updated.json
          grep -q 'Produto CI Atualizado' /tmp/product-updated.json
          echo 'Backend smoke tests passed.'
      - name: Module 1 - Authentication and hierarchy
        shell: bash
        run: bash tests/integration/backend-auth-hierarchy.sh
      - name: Real ERP API integration battery
        shell: bash
        run: bash tests/integration/backend-api-e2e.sh
      - name: Comprehensive backend API battery
        shell: bash
        run: bash tests/integration/backend-api-comprehensive.sh
      - name: Module 2 - Cadastros authorization matrix
        shell: bash
        run: bash tests/integration/backend-cadastros-authorization.sh
      - name: Module 2 - Clientes functional battery
        shell: bash
        run: bash tests/integration/backend-cadastro-clientes-functional.sh
      - name: Module 2 - Fornecedores functional battery
        shell: bash
        run: bash tests/integration/backend-cadastro-fornecedores-functional.sh
      - name: Module 2 - Cadastros functional battery
        shell: bash
        run: bash tests/integration/backend-cadastros-functional.sh
      - name: Module 2 - Product fiscal data
        shell: bash
        run: bash tests/integration/backend-product-fiscal.sh
