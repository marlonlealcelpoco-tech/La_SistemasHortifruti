name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend-test.yml'
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: la_erp
          POSTGRES_USER: la_erp
          POSTGRES_PASSWORD: la_erp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U la_erp -d la_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://la_erp:la_erp_dev@127.0.0.1:5432/la_erp
      JWT_SECRET: ci-test-secret-key-with-at-least-32-characters
      BOOTSTRAP_TOKEN: ci-bootstrap-token-with-at-least-16-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Initialize database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Apply database migrations
        run: |
          set -e
          for file in database/migrations/*.sql; do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Reset CI users
        run: |
          # The CI database is disposable. Some migrations may seed an initial user,
          # while /auth/setup is intentionally allowed only when users is empty.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'TRUNCATE TABLE users CASCADE;'

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Start API
        working-directory: backend
        run: |
          npm start > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1

      - name: Functional API smoke tests
        shell: bash
        run: |
          set -euo pipefail

          echo '1) /health'
          curl --fail --silent http://127.0.0.1:3000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          echo '2) Bootstrap administrator'
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Admin","email":"ci-admin@example.com","password":"TestPassword123!","bootstrapToken":"ci-bootstrap-token-with-at-least-16-chars"}' \
            http://127.0.0.1:3000/auth/setup > /tmp/setup.json
          cat /tmp/setup.json
          test "$(jq -r '.user.roles[0]' /tmp/setup.json)" = "ADMIN"
          TOKEN="$(jq -r '.token' /tmp/setup.json)"
          test -n "$TOKEN"

          echo '3) /auth/me'
          curl --fail --silent \
            -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:3000/auth/me > /tmp/me.json
          cat /tmp/me.json
          grep -q 'CI Admin' /tmp/me.json

          echo '4) Create product'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"code":"CI-001","name":"Produto CI","unit":"UN","cost":0.65,"salePrice":2.49,"profitMarginPct":283.08}' \
            http://127.0.0.1:3000/products > /tmp/product.json
          cat /tmp/product.json
          PRODUCT_ID="$(jq -r '.product.id' /tmp/product.json)"
          test "$PRODUCT_ID" != "null"

          echo '5) List products'
          curl --fail --silent \
            -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:3000/products?search=Produto%20CI' > /tmp/products.json
          cat /tmp/products.json
          grep -q 'Produto CI' /tmp/products.json

          echo '6) Update product'
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"code":"CI-001","name":"Produto CI Atualizado","unit":"UN","cost":0.70,"salePrice":2.79,"profitMarginPct":298.57}' \
            "http://127.0.0.1:3000/products/$PRODUCT_ID" > /tmp/product-updated.json
          cat /tmp/product-updated.json
          grep -q 'Produto CI Atualizado' /tmp/product-updated.json

          echo 'Backend smoke tests passed.'
